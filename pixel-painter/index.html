<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>像素画板</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: "Segoe UI", sans-serif;
    background: #1a1a2e;
    color: #eee;
    height: 100vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  /* 顶部工具栏 */
  .toolbar {
    display: flex;
    align-items: center;
    gap: 16px;
    padding: 10px 20px;
    background: #16213e;
    border-bottom: 1px solid #0f3460;
    flex-shrink: 0;
    flex-wrap: wrap;
  }
  .toolbar h1 { font-size: 18px; color: #e94560; margin-right: 4px; }

  .sep { width: 1px; height: 28px; background: #0f3460; }

  /* 工具按钮 */
  .tool-btn {
    background: #0f3460; border: 2px solid transparent; color: #aaa;
    border-radius: 8px; padding: 6px 10px; cursor: pointer;
    font-size: 18px; transition: all .15s; line-height: 1;
  }
  .tool-btn:hover { border-color: #e94560; color: #fff; }
  .tool-btn.active { background: #e94560; color: #fff; border-color: #e94560; }

  /* 颜色选择 */
  .color-row { display: flex; align-items: center; gap: 6px; }
  .color-swatch {
    width: 26px; height: 26px; border-radius: 6px; cursor: pointer;
    border: 2px solid transparent; transition: transform .1s;
    flex-shrink: 0;
  }
  .color-swatch:hover { transform: scale(1.2); }
  .color-swatch.active { border-color: #fff; transform: scale(1.15); }
  .custom-color {
    width: 26px; height: 26px; border-radius: 6px; cursor: pointer;
    border: 2px solid #555; padding: 0; overflow: hidden;
  }
  input[type=color] { width: 100%; height: 100%; border: none; cursor: pointer; padding: 0; }

  /* 画笔大小 */
  .size-row { display: flex; align-items: center; gap: 6px; }
  .size-row label { font-size: 12px; color: #888; }
  input[type=range] { width: 80px; accent-color: #e94560; }
  .size-preview {
    width: 24px; height: 24px; display: flex; align-items: center; justify-content: center;
  }
  .size-dot { background: #fff; border-radius: 2px; }

  /* 网格大小 */
  .grid-row { display: flex; align-items: center; gap: 6px; font-size: 12px; color: #888; }
  .grid-row select {
    background: #0f3460; color: #eee; border: none; border-radius: 6px;
    padding: 4px 8px; font-size: 12px; cursor: pointer;
  }

  /* 导出按钮 */
  .export-btn {
    background: #4caf50; color: #fff; border: none; border-radius: 8px;
    padding: 7px 16px; cursor: pointer; font-size: 13px; font-weight: 700;
    margin-left: auto;
  }
  .export-btn:hover { opacity: .85; }
  .clear-btn {
    background: #555; color: #fff; border: none; border-radius: 8px;
    padding: 7px 14px; cursor: pointer; font-size: 13px; font-weight: 700;
  }
  .clear-btn:hover { background: #e94560; }

  /* 画布区域 */
  .canvas-area {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    position: relative;
  }
  canvas#grid {
    image-rendering: pixelated;
    cursor: crosshair;
    box-shadow: 0 8px 40px #0008;
  }
</style>
</head>
<body>

<div class="toolbar">
  <h1>🎨 像素画板</h1>
  <div class="sep"></div>

  <!-- 工具 -->
  <button class="tool-btn active" id="toolPen" onclick="setTool('pen')" title="画笔">✏️</button>
  <button class="tool-btn" id="toolErase" onclick="setTool('erase')" title="橡皮">🧹</button>
  <button class="tool-btn" id="toolFill" onclick="setTool('fill')" title="填充">🪣</button>
  <button class="tool-btn" id="toolPick" onclick="setTool('pick')" title="取色">💉</button>

  <div class="sep"></div>

  <!-- 调色板 -->
  <div class="color-row" id="palette"></div>
  <div class="custom-color" title="自定义颜色">
    <input type="color" id="customColor" value="#e94560" oninput="pickCustom(this.value)">
  </div>

  <div class="sep"></div>

  <!-- 画笔大小 -->
  <div class="size-row">
    <label>大小</label>
    <input type="range" id="brushSize" min="1" max="8" value="1" oninput="updateBrushPreview()">
    <div class="size-preview"><div class="size-dot" id="sizeDot"></div></div>
  </div>

  <div class="sep"></div>

  <!-- 网格大小 -->
  <div class="grid-row">
    <label>画布</label>
    <select onchange="resizeGrid(+this.value)">
      <option value="16">16×16</option>
      <option value="32" selected>32×32</option>
      <option value="48">48×48</option>
      <option value="64">64×64</option>
    </select>
  </div>

  <div class="sep"></div>
  <button class="clear-btn" onclick="clearCanvas()">清空</button>
  <button class="export-btn" onclick="exportPNG()">导出 PNG</button>
</div>

<div class="canvas-area">
  <canvas id="grid"></canvas>
</div>

<script>
const PALETTE = [
  '#e94560','#ff9f43','#ffd32a','#0be881','#00d2d3',
  '#54a0ff','#5f27cd','#222f3e','#576574','#c8d6e5',
  '#ffffff','#ff6b6b','#48dbfb','#1dd1a1','#ff9ff3',
];

let gridSize = 32;
let cellSize = 16;
let cells = [];
let tool = 'pen';
let color = '#e94560';
let brushSize = 1;
let painting = false;

const canvas = document.getElementById('grid');
const ctx = canvas.getContext('2d');

// 初始化
function initGrid(n) {
  gridSize = n;
  cells = Array.from({length: n}, () => Array(n).fill(null));
  fitCanvas();
  render();
}

function fitCanvas() {
  const area = document.querySelector('.canvas-area');
  const maxW = area.clientWidth - 40;
  const maxH = area.clientHeight - 40;
  cellSize = Math.floor(Math.min(maxW, maxH) / gridSize);
  cellSize = Math.max(4, Math.min(cellSize, 24));
  canvas.width  = gridSize * cellSize;
  canvas.height = gridSize * cellSize;
}

function resizeGrid(n) {
  initGrid(n);
}

function render() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  // 棋盘背景
  for (let r = 0; r < gridSize; r++) {
    for (let c = 0; c < gridSize; c++) {
      const light = (r+c)%2 === 0;
      ctx.fillStyle = light ? '#2a2a3e' : '#222235';
      ctx.fillRect(c*cellSize, r*cellSize, cellSize, cellSize);
      if (cells[r][c]) {
        ctx.fillStyle = cells[r][c];
        ctx.fillRect(c*cellSize, r*cellSize, cellSize, cellSize);
      }
    }
  }
  // 网格线（半透明）
  ctx.strokeStyle = 'rgba(255,255,255,0.04)';
  ctx.lineWidth = 0.5;
  for (let i = 0; i <= gridSize; i++) {
    ctx.beginPath(); ctx.moveTo(i*cellSize, 0); ctx.lineTo(i*cellSize, canvas.height); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(0, i*cellSize); ctx.lineTo(canvas.width, i*cellSize); ctx.stroke();
  }
}

function getCell(e) {
  const rect = canvas.getBoundingClientRect();
  const x = e.clientX - rect.left;
  const y = e.clientY - rect.top;
  return [Math.floor(y/cellSize), Math.floor(x/cellSize)];
}

function paint(e) {
  const [r, c] = getCell(e);
  if (r < 0 || r >= gridSize || c < 0 || c >= gridSize) return;

  if (tool === 'pick') {
    const picked = cells[r][c];
    if (picked) { color = picked; setActivePaletteColor(picked); }
    setTool('pen');
    return;
  }
  if (tool === 'fill') {
    floodFill(r, c, cells[r][c], color);
    render(); return;
  }

  const half = Math.floor(brushSize/2);
  for (let dr = -half; dr < brushSize-half; dr++) {
    for (let dc = -half; dc < brushSize-half; dc++) {
      const nr = r+dr, nc = c+dc;
      if (nr >= 0 && nr < gridSize && nc >= 0 && nc < gridSize) {
        cells[nr][nc] = tool === 'erase' ? null : color;
      }
    }
  }
  render();
}

function floodFill(r, c, target, fill) {
  if (target === fill) return;
  const stack = [[r,c]];
  while (stack.length) {
    const [cr,cc] = stack.pop();
    if (cr<0||cr>=gridSize||cc<0||cc>=gridSize) continue;
    if (cells[cr][cc] !== target) continue;
    cells[cr][cc] = fill;
    stack.push([cr+1,cc],[cr-1,cc],[cr,cc+1],[cr,cc-1]);
  }
}

canvas.addEventListener('mousedown', e => { painting=true; paint(e); });
canvas.addEventListener('mousemove', e => { if(painting) paint(e); });
canvas.addEventListener('mouseup', () => painting=false);
canvas.addEventListener('mouseleave', () => painting=false);

// 防右键
canvas.addEventListener('contextmenu', e => e.preventDefault());

function setTool(t) {
  tool = t;
  ['pen','erase','fill','pick'].forEach(x => {
    document.getElementById('tool'+x[0].toUpperCase()+x.slice(1)).classList.toggle('active', x===t);
  });
}

function buildPalette() {
  const row = document.getElementById('palette');
  row.innerHTML = '';
  PALETTE.forEach(c => {
    const s = document.createElement('div');
    s.className = 'color-swatch' + (c===color?' active':'');
    s.style.background = c;
    s.title = c;
    s.onclick = () => { color = c; document.getElementById('customColor').value = c; setActivePaletteColor(c); };
    row.appendChild(s);
  });
}

function setActivePaletteColor(c) {
  color = c;
  document.querySelectorAll('.color-swatch').forEach(s => s.classList.toggle('active', s.style.background === hexToRgb(c) || s.style.background === c));
}

function hexToRgb(hex) {
  const r=parseInt(hex.slice(1,3),16), g=parseInt(hex.slice(3,5),16), b=parseInt(hex.slice(5,7),16);
  return `rgb(${r}, ${g}, ${b})`;
}

function pickCustom(v) { color = v; document.querySelectorAll('.color-swatch').forEach(s => s.classList.remove('active')); }

function updateBrushPreview() {
  brushSize = +document.getElementById('brushSize').value;
  const dot = document.getElementById('sizeDot');
  const px = brushSize * 3;
  dot.style.width = px+'px';
  dot.style.height = px+'px';
}

function clearCanvas() {
  if (!confirm('确定清空画布？')) return;
  cells = Array.from({length:gridSize}, () => Array(gridSize).fill(null));
  render();
}

function exportPNG() {
  // 导出不含网格线的干净图像
  const exp = document.createElement('canvas');
  const scale = Math.max(1, Math.floor(512/gridSize));
  exp.width = gridSize*scale; exp.height = gridSize*scale;
  const ec = exp.getContext('2d');
  ec.imageSmoothingEnabled = false;
  for (let r=0; r<gridSize; r++) {
    for (let c=0; c<gridSize; c++) {
      ec.fillStyle = cells[r][c] || 'transparent';
      if (cells[r][c]) ec.fillRect(c*scale, r*scale, scale, scale);
    }
  }
  const a = document.createElement('a');
  a.download = `pixel-art-${Date.now()}.png`;
  a.href = exp.toDataURL('image/png');
  a.click();
}

// 窗口大小变化时重新适配
window.addEventListener('resize', () => { fitCanvas(); render(); });

// 启动
buildPalette();
updateBrushPreview();
initGrid(32);
</script>
</body>
</html>
